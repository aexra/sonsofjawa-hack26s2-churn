stages:
  - build
  - deploy

variables:
  GIT_DEPTH: "1"
  KANIKO_IMAGE: ${NEXUS_PULL_REGISTRY}/kaniko-project/executor:debug
  IMAGE_API: ${NEXUS_PUSH_REGISTRY}/hack26s2/api:dev
  IMAGE_APP: ${NEXUS_PUSH_REGISTRY}/hack26s2/app:dev
  IMAGE_MCP: ${NEXUS_PUSH_REGISTRY}/hack26s2/mcp:dev
  CHURN_HOST: "10.6.7.100"
  CHURN_DIR: "/home/aexra/.modules/churn"

.kaniko:
  stage: build
  image:
    name: $KANIKO_IMAGE
    entrypoint: [""]
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  before_script:
    - mkdir -p /kaniko/.docker
    - printf '%s\n' "$DOCKER_AUTH_CONFIG" > /kaniko/.docker/config.json

build-api:
  extends: .kaniko
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/apps/api/Dockerfile"
      --destination "${IMAGE_API}"
      --snapshot-mode=redo
      --build-arg "BASE_REGISTRY=${NEXUS_PULL_REGISTRY}"
      --build-arg "GRADLE_MIRROR=${NEXUS_MAVEN_PUBLIC}"
      --verbosity info

build-app:
  extends: .kaniko
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/apps/web"
      --dockerfile "${CI_PROJECT_DIR}/apps/web/Dockerfile"
      --destination "${IMAGE_APP}"
      --snapshot-mode=redo
      --build-arg "BASE_REGISTRY=${NEXUS_PULL_REGISTRY}"
      --build-arg "NPM_REGISTRY=${NEXUS_NPM_REGISTRY}"
      --verbosity info

build-mcp:
  extends: .kaniko
  script:
    - >
      /kaniko/executor
      --context "${CI_PROJECT_DIR}/apps/mcp"
      --dockerfile "${CI_PROJECT_DIR}/apps/mcp/Dockerfile"
      --destination "${IMAGE_MCP}"
      --snapshot-mode=redo
      --build-arg "BASE_REGISTRY=${NEXUS_PULL_REGISTRY}"
      --build-arg "PIP_INDEX_URL=https://nexus.aexra.ru/repository/pypi/simple"
      --verbosity info

deploy:
  stage: deploy
  image: ${NEXUS_PULL_REGISTRY}/library/alpine:3.20
  tags:
    - docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  needs:
    - build-api
    - build-app
    - build-mcp
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$CHURN_DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$CHURN_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - set -eu
    - scp "${CI_PROJECT_DIR}/ops/compose/compose.prod.yml" "aexra@${CHURN_HOST}:${CHURN_DIR}/docker-compose.yml"
    - |
      ssh "aexra@${CHURN_HOST}" "set -eu
      cd ${CHURN_DIR}
      docker compose pull
      docker compose up -d --pull always --wait
      docker compose ps
      "
