name: churn

services:
  pg:
    image: ${BASE_REGISTRY:-docker.io}/library/postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-churn}
      POSTGRES_USER: ${POSTGRES_USER:-churn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-churn}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ${IMAGE_REGISTRY:-churn}/churn-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        GRADLE_MIRROR: ${GRADLE_MIRROR:-}
    env_file:
      - path: ../../.env
        required: false
    networks: [default, ml-internal]
    environment:
      ML_URL: http://ml-server:8091
      ML_SYNC_INTERVAL: ${ML_SYNC_INTERVAL:-60000}
      ASSISTANT_MCP_URL: http://mcp:8090/mcp
    depends_on:
      pg:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && grep -q '"status":"UP"' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:-churn}/churn-web:${IMAGE_TAG:-local}
    build:
      context: ../../apps/web
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    env_file:
      - path: ../../.env
        required: false
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp:
    image: ${IMAGE_REGISTRY:-churn}/churn-mcp:${IMAGE_TAG:-local}
    build:
      context: ../../apps/mcp
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      CHURN_API_URL: http://api:8080
      MCP_PORT: 8090
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8090}:8090"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    image: ${BASE_REGISTRY:-docker.io}/library/postgres:18-alpine
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGHOST: pg
      PGDATABASE: ${POSTGRES_DB:-churn}
      PGUSER: ${POSTGRES_USER:-churn}
      PGPASSWORD: ${POSTGRES_PASSWORD:-churn}
      DEMO_SEED: ${DEMO_SEED:-demo}
      DEMO_CLOCK: ${DEMO_CLOCK:-shifted}
      DEMO_AS_OF: ${DEMO_AS_OF:-2026-10-19T15:00:00Z}
    volumes:
      - ../scripts:/scripts:ro
      - ../seeds:/seeds:ro
    entrypoint: ["sh", "/scripts/seed.sh"]

  ml-server:
    image: ${IMAGE_REGISTRY:-churn}/churn-ml:${IMAGE_TAG:-local}
    build:
      context: ../../ml
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${ML_PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ml-internal]
    environment:
      ML_DEMO_ENABLED: ${ML_DEMO_ENABLED:-true}
      ML_RETRAIN_SECONDS: ${ML_RETRAIN_SECONDS:-3600}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ml_data:/app/ml/reports
    command: [serve]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  ml: &ml
    image: ${IMAGE_REGISTRY:-churn}/churn-ml:${IMAGE_TAG:-local}
    build:
      context: ../../ml
      args:
        BASE_REGISTRY: ${BASE_REGISTRY:-docker.io}
        PIP_INDEX_URL: ${ML_PIP_INDEX_URL:-https://pypi.org/simple}
    profiles: [ml]
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ml_data:/app/ml/reports
    command:
      - predict
      - --model
      - ${ML_MODEL_PATH:-/app/ml/reports/trained/model.json}
      - --input
      - ${ML_PREDICT_INPUT:-/app/ml/reports/requests.json}
      - --out
      - ${ML_PREDICT_OUTPUT:-/app/ml/reports/predictions.json}

  ml-train:
    <<: *ml
    profiles: [ml-training]
    command:
      - train
      - --input
      - ${ML_TRAIN_INPUT:-/app/ml/reports/dataset.json}
      - --train-end
      - ${ML_TRAIN_END:-}
      - --calibration-end
      - ${ML_CALIBRATION_END:-}
      - --test-end
      - ${ML_TEST_END:-}
      - --out-dir
      - ${ML_TRAIN_OUTPUT:-/app/ml/reports/trained}
      - --provenance
      - real

volumes:
  pgdata:
  ml_data:

networks:
  ml-internal:
    internal: true
