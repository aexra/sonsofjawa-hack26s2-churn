server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    include: log-${LOG_FORMAT:text}
  application:
    name: churn-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://pg:5432/churn}
    username: ${DB_USER:churn}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: false

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    correlation: "[%X{requestId:-}] "
